<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-phone.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Price Aggregator</title>

    <meta name="description" content="Compare phone prices across multiple stores in one place - browse listings, filter by brand, color, storage and RAM, and track price history." />
    <meta name="theme-color" content="#0284c7" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Phone Price Aggregator" />
    <meta property="og:description" content="Compare phone prices across multiple stores in one place - browse listings, filter by brand, color, storage and RAM, and track price history." />
    <meta property="og:image" content="https://phone-aggregator-project.vercel.app/og-image.svg" />
    <meta property="og:url" content="https://phone-aggregator-project.vercel.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Phone Price Aggregator" />
    <meta name="twitter:description" content="Compare phone prices across multiple stores in one place - browse listings, filter by brand, color, storage and RAM, and track price history." />

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #fafafa;
        z-index: 9999;
      }
      .initial-loader-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        box-shadow: 0 6px 20px -6px rgba(2, 132, 199, 0.35);
      }
      .initial-loader-spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2.5px solid rgba(2, 132, 199, 0.14);
        border-top-color: #0284c7;
        animation: initial-loader-spin 0.85s linear infinite;
      }
      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .initial-loader-spinner {
          animation-duration: 2.2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!--
        Shown only until React's first render replaces #root's contents (see main.jsx,
        which holds this on screen for a moment on purpose so it's actually visible) - this
        is the one gap a React component can't cover in a client-rendered app, since there's
        no React tree yet. See src/components/LoadingSpinner.jsx for the reusable, in-tree
        version of this same spinner.
      -->
      <div id="initial-loader" role="status" aria-label="Loading">
        <img class="initial-loader-icon" src="/favicon-phone.svg" alt="" width="44" height="44" />
        <span class="initial-loader-spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
